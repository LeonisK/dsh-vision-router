name: Build Star History Snapshot

on:
  push:
    paths:
      - '.github/workflows/star-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          width: '1000'
          update-readme: 'false'
          commit: 'false'

      - name: Add chart blocks to both READMEs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = {
              "README.md": '''<!-- star-history-chart -->
          ## Star History

          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="assets/star-history/star-history-dark.svg">
              <img alt="Star history chart" src="assets/star-history/star-history-light.svg" width="100%">
            </picture>
          </p>''',
              "README.zh.md": '''<!-- star-history-chart -->
          ## Star 趋势

          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="assets/star-history/star-history-dark.svg">
              <img alt="Star 历史趋势图" src="assets/star-history/star-history-light.svg" width="100%">
            </picture>
          </p>''',
          }

          for filename, block in blocks.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "<!-- star-history-chart -->" not in text:
                  path.write_text(text.rstrip() + "\n\n" + block + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: star-history-bundle
          path: |
            README.md
            README.zh.md
            assets/star-history/
          if-no-files-found: error
