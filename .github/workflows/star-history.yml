name: Star History

on:
  push:
    paths:
      - '.github/workflows/star-history.yml'
  schedule:
    - cron: '17 */6 * * *'
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: star-history

      - uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          width: '1000'
          update-readme: 'false'
          commit: 'true'
          commit-message: 'chore: update star history [skip ci]'

  bootstrap-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Star History to both READMEs on a review branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = {
              "README.md": '''<!-- star-history-chart -->
          ## Star History

          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/ysr666/dsh-vision-router/star-history/assets/star-history/star-history-dark.svg">
              <img alt="Star history chart" src="https://raw.githubusercontent.com/ysr666/dsh-vision-router/star-history/assets/star-history/star-history-light.svg" width="100%">
            </picture>
          </p>''',
              "README.zh.md": '''<!-- star-history-chart -->
          ## Star 趋势

          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/ysr666/dsh-vision-router/star-history/assets/star-history/star-history-dark.svg">
              <img alt="Star 历史趋势图" src="https://raw.githubusercontent.com/ysr666/dsh-vision-router/star-history/assets/star-history/star-history-light.svg" width="100%">
            </picture>
          </p>''',
          }

          for filename, block in blocks.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "<!-- star-history-chart -->" not in text:
                  path.write_text(text.rstrip() + "\n\n" + block + "\n", encoding="utf-8")
          PY

          if git diff --quiet -- README.md README.zh.md; then
            echo "README already contains Star History."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B docs/star-history-readme
          git add README.md README.zh.md
          git commit -m "docs: add star history chart"
          git push --force-with-lease origin HEAD:docs/star-history-readme
